[project]
name = "agent-signals"
version = "0.1.0"
description = "Unified notification/voice/focus infrastructure for AI coding agents"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
agent-signal = "agent_signals.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_signals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
